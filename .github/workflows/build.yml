name: Build Windows Installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # Releases 作成のため

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Download ffmpeg + ffplay
        shell: pwsh
        run: |
          # 配布元を 1 つに頼らない。gyan.dev は共有ホスト上にあり、
          # 503 (resource limitation) でビルドが止まる事例が実際にあった。
          # 失敗したら少し待って再試行し、それでも駄目なら
          # GitHub 上でホストされている BtbN のビルドに切り替える。
          # どちらも bin/ 配下に ffmpeg.exe / ffplay.exe を含む LGPL 版。
          $sources = @(
            'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip',
            'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip'
          )

          $ok = $false
          foreach ($url in $sources) {
            foreach ($attempt in 1..3) {
              try {
                Write-Host "Downloading ffmpeg from $url (attempt $attempt)"
                Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip -UseBasicParsing -TimeoutSec 600
                $ok = $true
                break
              } catch {
                Write-Warning "  failed: $($_.Exception.Message)"
                if ($attempt -lt 3) { Start-Sleep -Seconds (15 * $attempt) }
              }
            }
            if ($ok) { break }
          }
          if (-not $ok) { throw 'ffmpeg をどの配布元からも取得できませんでした' }

          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-extracted -Force
          New-Item -ItemType Directory -Path ffmpeg -Force | Out-Null
          foreach ($name in @('ffmpeg.exe', 'ffplay.exe')) {
            $exe = Get-ChildItem -Path ffmpeg-extracted -Filter $name -Recurse | Select-Object -First 1
            if (-not $exe) { throw "$name not found in archive" }
            Copy-Item -Path $exe.FullName -Destination "ffmpeg/$name" -Force
          }
          Get-ChildItem ffmpeg | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}
          & ffmpeg/ffmpeg.exe -version

      - name: Download speaker diarization models
        shell: pwsh
        run: |
          # models/ は .gitignore で除外してある(合計 44MB・ライセンスも別々)。
          # 取得元と SHA-256 はスクリプト側に 1 つだけ書く。ここに URL を
          # 書き写すと、片方だけ古くなる。
          # 依存を入れる前に走る —— 標準ライブラリだけで動く。
          python tools/fetch_diarize_models.py

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests
        shell: pwsh
        run: |
          # ランナーの標準出力は cp1252。テスト側でも出力を UTF-8 に
          # 固定しているが、subprocess 等からの出力も含めて念のため。
          $env:PYTHONIOENCODING = 'utf-8'
          $env:PATH = "$PWD\ffmpeg;$env:PATH"
          python tests/test_core.py
          python tests/test_anchor.py
          python tests/test_inspection.py
          python tests/test_pipeline_integration.py
          python tests/test_gui_smoke.py
          # 実データを使う 1 件は、音声が無い環境では自動で飛ぶ（CI がここ）
          python tests/test_listen_order.py

      - name: Build with PyInstaller
        run: pyinstaller --clean -y build.spec

      - name: Smoke test (exe should exist)
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/GeminiTranscriber/GeminiTranscriber.exe')) {
            throw 'Build artifact not found'
          }
          Get-ChildItem dist/GeminiTranscriber | Select-Object Name, Length

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer (Inno Setup)
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeminiTranscriber-Installer
          path: Output/*.exe
          if-no-files-found: error

      - name: Upload portable build (zip)
        uses: actions/upload-artifact@v4
        with:
          name: GeminiTranscriber-Portable
          path: dist/GeminiTranscriber/**

      - name: Create GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Output/*.exe
          generate_release_notes: true
          draft: false
          prerelease: false
